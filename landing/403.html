<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 — monastryx</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        color: #1f1f1f;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #111; color: #eee; }
      }
      main {
        max-width: 480px;
        padding: 2rem;
        text-align: center;
      }
      .code {
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #999;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.5;
        color: #666;
      }
      @media (prefers-color-scheme: dark) {
        p { color: #999; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">403 Forbidden</div>
      <h1>Access denied</h1>
      <p>This resource is restricted. If you believe you should have access, contact the monastryx administrator.</p>
    </main>
  </body>
</html>
