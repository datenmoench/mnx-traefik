<!DOCTYPE html>
<html>
  <head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />

    <title>RXL Services</title>
    <style>
      header#main {
        background-color: #3a0d1b;
        position: absolute;
        top: 0;
        width: 100%;
      }
      footer#main {
        background-color: #3a0d1b;
        position: absolute;
        bottom: 0;
        width: 100%;
      }
      p {
        margin-top: 0px;
      }

      strong {
        font-weight: 700;
        text-transform: uppercase;
      }

      strong,
      a {
        font-weight: 700;
        color: #9e264c;
        text-decoration: none;
      }

      h1 {
        margin-top: 0;
        padding-top: 0;
        font-family: "Abhaya Libre", serif;
        font-optical-sizing: auto;
        font-style: normal;
        font-size: 56px;
      }

      h2 {
        font-family: "Abhaya Libre", serif;
        font-optical-sizing: auto;
        font-style: normal;
        font-size: 32px;

        font-weight: 700;
        color: #ffffffa3;
        font-optical-sizing: auto;
        font-style: normal;
        margin: 15px;
      }

      body {
        padding: 0;
        margin: 0;

        font-family: "DM Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-style: normal;
        font-size: 16px;
        color: #33282b;
      }

      img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        margin: 15px;
      }
      .content {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        height: 100vh;
        padding: 20px;
        box-sizing: border-box;
      }

      .center {
        flex: 1;
        min-width: 300px;
        max-width: 600px;
        padding: 20px;
        box-sizing: border-box;
      }

      .content img {
        flex: 1;
        min-width: 300px;
        max-width: 600px;
        padding: 20px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <header id="main"><h2>RXL Services</h2></header>
    <div class="content">
      <img src="/assets/hardware.png" alt="Gear" />
      <div class="center">
        <p>
          <strong>403 Forbidden</strong>
        </p>
        <h1>This Area Requires Special Access</h1>

        <p>
          This resource is reserved for internal use only. If you believe you
          should have access, please reach out to our technical team.
        </p>

        <p>
          <a href="https://rxlgroup.com/">rxlgroup.com</a>
        </p>
      </div>
    </div>
    <footer id="main">
      <img src="/assets/gear.png" alt="Gear" width="120" />
    </footer>
  </body>
</html>
