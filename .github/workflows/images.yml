# Build the edge images once per push and publish them to ghcr.io,
# tagged with the commit SHA (what a deploy names) and `main`.

name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mnx-traefik
            context: ./traefik
          - name: mnx-holding-page
            context: ./landing
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/datenmoench/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/datenmoench/${{ matrix.name }}:main

  # The stack's compose file, published as a versioned OCI artifact next to
  # the images (same registry, same tag, same pull token). A box pulls it
  # with `docker compose -f oci://ghcr.io/datenmoench/mnx-traefik-compose:<tag>`
  # and never needs this repository. Only the file travels: variables stay
  # unresolved (the box's .env fills them) and no env values are included.
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: publish the compose file
        run: |
          yes | docker compose publish ghcr.io/datenmoench/mnx-traefik-compose:${{ github.sha }}
          yes | docker compose publish ghcr.io/datenmoench/mnx-traefik-compose:main
