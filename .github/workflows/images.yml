# Build the edge images once per push and publish them to ghcr.io,
# tagged with the commit SHA (what a deploy names) and `main`.

name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mnx-traefik
            context: ./traefik
          - name: mnx-holding-page
            context: ./landing
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/datenmoench/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/datenmoench/${{ matrix.name }}:main
