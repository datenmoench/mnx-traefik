# Build the edge images once per push and publish them to ghcr.io,
# tagged with the commit SHA (what a deploy names) and `main`.

name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mnx-traefik
            context: ./traefik
          - name: mnx-holding-page
            context: ./landing
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/datenmoench/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/datenmoench/${{ matrix.name }}:main

  # The stack's compose file (plus .env.example as its documentation),
  # pushed byte-for-byte with ORAS as a versioned OCI artifact next to the
  # images: same registry, same tag, same pull token. A box pulls it into
  # ~/mnx-traefik/docker-compose.yml and never needs this repository; its own
  # .env fills the variables. (`docker compose publish` was not usable: it
  # refuses or embeds `environment:` values.)
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@v1

      - name: publish the compose file
        run: |
          oras push ghcr.io/datenmoench/mnx-traefik-compose:${{ github.sha }} \
            --artifact-type application/vnd.monastryx.compose \
            docker-compose.yml:text/yaml .env.example:text/plain
          oras tag ghcr.io/datenmoench/mnx-traefik-compose:${{ github.sha }} main
