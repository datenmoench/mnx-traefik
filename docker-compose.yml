# Images are built by CI (.github/workflows/images.yml) and pulled by tag;
# `build:` stays so a checkout can still build them locally. MNX_IMAGE_TAG
# names the commit a cell runs (the deploy sets it; `main` = the head).
name: mnx-traefik

services:
  traefik:
    image: ${MNX_REGISTRY:-ghcr.io}/datenmoench/mnx-traefik:${MNX_IMAGE_TAG:-main}
    build: ./traefik
    container_name: mnx-traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme

    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Catch-all fallback for any unmapped hostname.
      # Serves the holding page over HTTPS using Traefik's built-in
      # self-signed cert (browsers will show a warning, which is the
      # right signal for "you hit something that doesn't exist here").
      # No Let's Encrypt cert is requested — we don't want to fetch
      # certs for arbitrary hostnames (rate limits / DDoS surface).
      - "traefik.http.routers.fallback.rule=HostRegexp(`^.+$`)"
      - "traefik.http.routers.fallback.priority=1"
      - "traefik.http.routers.fallback.entrypoints=websecure"
      - "traefik.http.routers.fallback.tls=true"
      - "traefik.http.routers.fallback.service=holding-page"

      # Pre-provisioned routers for known monastryx machinenames.
      # These trigger Let's Encrypt cert acquisition right away so we
      # have valid TLS even before mnx-infra is deployed. Once mnx-infra
      # comes up with its own Host() routers (default higher priority),
      # those override these and serve real traffic instead of the
      # holding page. Keep priority=1 so mnx-infra always wins.
      - "traefik.http.routers.api-pre.rule=Host(`${MNX_API_HOST:?set MNX_API_HOST in .env (the hostname this cell answers to)}`)"
      - "traefik.http.routers.api-pre.priority=1"
      - "traefik.http.routers.api-pre.entrypoints=websecure"
      - "traefik.http.routers.api-pre.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-pre.service=holding-page"

      - "traefik.http.routers.hasura-pre.rule=Host(`${MNX_HASURA_HOST:?set MNX_HASURA_HOST in .env (the hostname this cell answers to)}`)"
      - "traefik.http.routers.hasura-pre.priority=1"
      - "traefik.http.routers.hasura-pre.entrypoints=websecure"
      - "traefik.http.routers.hasura-pre.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hasura-pre.service=holding-page"


  holding-page:
    image: ${MNX_REGISTRY:-ghcr.io}/datenmoench/mnx-holding-page:${MNX_IMAGE_TAG:-main}
    build: ./landing
    container_name: mnx-traefik-holding-page
    restart: always
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.holding-page.loadbalancer.server.port=80"

  # Central only (COMPOSE_PROFILES=central in its .env): the console's old
  # name, console.<domain>, redirected to app.<domain> for every mail and
  # bookmark that still carries it (2026-10-31). A cell never had the old
  # name, so it never activates this; a router on a profile-gated container
  # is the one way to keep a hostname — and its certificate request — off
  # the cells. The holding page is only the service the router needs. The
  # defaults below never serve: compose interpolates every service's labels
  # before it applies the profiles, so a cell's empty values need one.
  console-legacy:
    image: ${MNX_REGISTRY:-ghcr.io}/datenmoench/mnx-holding-page:${MNX_IMAGE_TAG:-main}
    container_name: mnx-traefik-console-legacy
    profiles: [central]
    restart: always
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.console-legacy.loadbalancer.server.port=80"
      - "traefik.http.routers.console-legacy.rule=Host(`${MNX_CONSOLE_LEGACY_HOST:-console.invalid}`)"
      - "traefik.http.routers.console-legacy.entrypoints=websecure"
      - "traefik.http.routers.console-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.console-legacy.service=console-legacy"
      - "traefik.http.routers.console-legacy.middlewares=console-legacy-redirect"
      - "traefik.http.middlewares.console-legacy-redirect.redirectregex.regex=^https://[^/]+/(.*)"
      - "traefik.http.middlewares.console-legacy-redirect.redirectregex.replacement=https://${MNX_CONSOLE_HOST:-app.invalid}/$${1}"
      - "traefik.http.middlewares.console-legacy-redirect.redirectregex.permanent=true"

networks:
  proxy:
    external: true

volumes:
  # Let's Encrypt account + certificates; the one piece of state here.
  acme:
