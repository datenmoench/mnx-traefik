# Traefik v3 dynamic config — middlewares, additional routers, etc.
#
# Why a separate file: in v3 the static `traefik.yml` only carries entrypoints,
# providers, certificatesResolvers, api, log, etc. Anything HTTP-routing-related
# (routers, services, middlewares) must come from a provider. The docker
# provider handles container labels; this directory is the source for things
# that aren't tied to a specific container.
#
# Empty today. The ipallowlist middleware that lived here guarded the Hasura
# console, which has had no route through the edge since 2026-10-21 (Hasura
# listens on the machine's loopback; `make tunnel` reaches it); it was removed
# 2026-10-25 rather than ship the operator's addresses in every image.
