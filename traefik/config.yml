entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: paul.geisler@datenmoench.ai
      storage: acme.json
      tlsChallenge: {}

providers:
  docker:
    watch: true
    network: proxy
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

http:
  middlewares:
    ipallowlist:
      ipAllowList:
        sourceRange:
          # TODO: replace with the IPs that should reach IP-restricted endpoints
          # (e.g. hasura.monastryx.ai console). Find your current IP at
          # https://www.whatismyip.com and add it as a /32. The 172.18.0.1/32
          # entry is the Docker bridge gateway, which lets sibling containers
          # on the host reach restricted services.
          - "172.18.0.1/32"  # Docker bridge gateway

api:
  dashboard: false

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json

log:
  level: INFO
  filePath: "/var/log/traefik/traefik.log"
