entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: paul.geisler@datenmoench.ai
      storage: acme.json
      tlsChallenge: {}

providers:
  docker:
    watch: true
    network: proxy
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

http:
  middlewares:
    ipallowlist:
      ipAllowList:
        sourceRange:
          # IPs allowed to reach restricted endpoints (e.g. hasura.monastryx.ai console).
          # Add a /32 per IP. Find current IP at https://www.whatismyip.com.
          # Update when working from a new network (coffee shop, mobile hotspot, etc).
          - "172.18.0.1/32"      # Docker bridge gateway (host-internal services)
          - "62.157.64.176/32"   # paul.geisler@datenmoench.ai (home office)

api:
  dashboard: false

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json

log:
  level: INFO
  filePath: "/var/log/traefik/traefik.log"
