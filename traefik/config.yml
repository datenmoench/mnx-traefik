entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: paul.geisler@datenmoench.ai
      storage: acme.json
      tlsChallenge: {}

providers:
  docker:
    watch: true
    network: proxy
  file:
    # Watch a directory rather than a single file — single-file bind mounts
    # break Traefik's inotify-based file watcher in Docker.
    directory: /etc/traefik/dynamic
    watch: true

# NOTE: routers, services, and middlewares (like ipallowlist) live in
# traefik/dynamic.yml — Traefik v3 doesn't accept them in this static file.

api:
  dashboard: false

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json

log:
  level: INFO
  filePath: "/var/log/traefik/traefik.log"
