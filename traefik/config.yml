entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: paul.geisler@datenmoench.ai
      # The `acme` named volume; traefik creates the file (mode 600) itself.
      storage: /acme/acme.json
      tlsChallenge: {}

providers:
  docker:
    watch: true
    network: proxy
    # Containers must opt in with `traefik.enable=true` to be routed.
    # Default-on (true) caused noisy log warnings for unrelated containers
    # (e.g. mnx-connections-db) being mis-discovered.
    exposedByDefault: false
  file:
    # Watch a directory rather than a single file — single-file bind mounts
    # break Traefik's inotify-based file watcher in Docker.
    directory: /etc/traefik/dynamic
    watch: true

# NOTE: routers, services, and middlewares not tied to a container live in
# traefik/dynamic/ — Traefik v3 doesn't accept them in this static file.

api:
  dashboard: false

# Both logs go to stdout/stderr (no filePath): `docker logs mnx-traefik`,
# like every other container on the box.
accessLog:
  format: json

log:
  level: INFO
